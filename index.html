<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanahan Nails | Luxury Loyalty & Citas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root { --burgundy: #7A121F; --cream: #F9F4F0; --dark-text: #2C2C2C; }
        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { background-color: var(--cream); color: var(--dark-text); font-family: 'Poppins', sans-serif; margin: 0; min-height: 100vh; }
        
        .brand-container { text-align: center; margin-bottom: 30px; }
        .brand-main { font-family: 'Playfair Display', serif; font-size: 44px; color: var(--burgundy); text-transform: uppercase; font-weight: 700; line-height: 0.9; }
        .brand-sub { font-family: 'Playfair Display', serif; font-style: italic; font-size: 56px; color: var(--burgundy); margin-top: -15px; display: block; }
        
        nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(249, 244, 240, 0.85); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(122, 18, 31, 0.08); }
        .nav-btn { text-decoration: none; color: var(--burgundy); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; padding: 8px 16px; border: 1px solid var(--burgundy); cursor: pointer; font-weight: 600; background: transparent; }
        .nav-btn:hover { background: var(--burgundy); color: white; }

        .luxury-card { background: white; padding: 40px; box-shadow: 10px 10px 40px rgba(122, 18, 31, 0.03); position: relative; }
        .form-control { border: none; border-bottom: 1px solid #D1C7BD; border-radius: 0; padding: 12px 5px; font-size: 14px; background: transparent; }
        .btn-luxury { background: var(--burgundy); color: white; border: none; padding: 16px 20px; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; width: 100%; margin-top: 20px; font-weight: 600; }
        
        .stamps-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 35px 0; }
        .stamp-circle { aspect-ratio: 1; border: 1px solid #D1C7BD; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; color: #D1C7BD; }
        .stamp-circle.active { background: var(--burgundy); color: white; border-color: var(--burgundy); }

        .admin-table { width: 100%; border-collapse: separate; border-spacing: 0 12px; }
        .admin-table th { font-size: 9px; text-transform: uppercase; color: var(--burgundy); border-bottom: 2px solid var(--burgundy); padding: 8px 10px; }
    </style>
</head>
<body onload="configurarFechas()">

    <nav>
        <div style="font-family: 'Playfair Display', serif; font-size: 18px; color: var(--burgundy);">S.N</div>
        <div class="d-flex gap-2">
            <button class="nav-btn" onclick="mostrarVista('vistaAccesoAdmin')">Acceso Salón</button>
            <button class="nav-btn" onclick="mostrarVista('login')" style="background: var(--burgundy); color: white;">Inicio</button>
        </div>
    </nav>

    <div class="container py-5">
        
        <div id="login" class="row justify-content-center">
            <div class="col-12 col-md-5">
                <div class="brand-container">
                    <span class="brand-main">SHANAHAN</span>
                    <span class="brand-sub">Nails</span>
                </div>
                <div class="luxury-card">
                    <h5 class="text-center mb-4" style="color: var(--burgundy);">CONSULTAR PUNTOS</h5>
                    <input type="text" class="form-control mb-3" id="loginUsuario" placeholder="Nombre completo">
                    <input type="text" class="form-control mb-4" id="loginPass" placeholder="Teléfono" oninput="validarVitalNumeros(this)">
                    <button class="btn btn-luxury" onclick="iniciarSesionCliente()">ENTRAR</button>
                    <button class="btn btn-link w-100 mt-3 text-dark text-decoration-none" style="font-size: 11px;" onclick="mostrarVista('vistaPedirCita')">¿NUEVA CLIENTA? PIDE TU CITA AQUÍ</button>
                </div>
            </div>
        </div>

        <div id="vistaCliente" class="row justify-content-center" style="display: none;">
            <div class="col-12 col-md-6 text-center">
                <div class="luxury-card">
                    <h2 id="clienteNombre" style="font-family: 'Playfair Display', serif;">Cliente</h2>
                    <div class="stamps-container" id="stampsGrid"></div>
                    <div id="clienteEstado" class="reward-info mt-3"></div>
                    <button class="btn btn-link mt-4 text-secondary" onclick="mostrarVista('login')">Cerrar Sesión</button>
                </div>
            </div>
        </div>

        <div id="vistaPedirCita" class="row justify-content-center" style="display: none;">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="luxury-card">
                    <h5 class="mb-4 text-center" style="color: var(--burgundy); font-family: 'Playfair Display', serif; font-size: 24px;">SOLICITAR CITA</h5>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Nombre y Apellido</label>
                        <input type="text" class="form-control" id="citaNombre" placeholder="Tu nombre">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Teléfono (Solo números)</label>
                        <input type="text" class="form-control" id="citaTelefono" placeholder="Ej: 600000000" oninput="validarVitalNumeros(this)">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small text-muted">Fecha (Hoy en adelante)</label>
                            <input type="date" class="form-control" id="citaFecha" onchange="validarFechaVital(this)">
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label small text-muted">Hora</label>
                            <input type="time" class="form-control" id="citaHora">
                        </div>
                    </div>
                    <button class="btn btn-luxury" onclick="enviarSolicitudCita()">ENVIAR SOLICITUD</button>
                    <button class="btn btn-outline-secondary w-100 mt-2" onclick="mostrarVista('login')">VOLVER</button>
                </div>
            </div>
        </div>

        <div id="vistaAccesoAdmin" class="row justify-content-center" style="display: none;">
            <div class="col-12 col-md-4">
                <div class="luxury-card">
                    <h5 class="text-center mb-4">ACCESO ADMINISTRADOR</h5>
                    <input type="text" class="form-control mb-3" id="adminUser" placeholder="Usuario">
                    <input type="password" class="form-control mb-4" id="adminPass" placeholder="Contraseña">
                    <button class="btn btn-luxury" onclick="loginAdmin()">ENTRAR</button>
                </div>
            </div>
        </div>

        <div id="vistaAdmin" class="row g-4" style="display: none;">
            <div class="col-12 col-lg-4">
                <div class="luxury-card">
                    <h5 class="mb-4">Nueva Clienta</h5>
                    <input type="text" class="form-control mb-3" id="regNombre" placeholder="Nombre">
                    <input type="text" class="form-control mb-4" id="regTelef" placeholder="Teléfono" oninput="validarVitalNumeros(this)">
                    <button class="btn-luxury" onclick="registrarNuevoCliente()">REGISTRAR</button>
                    <hr class="my-5">
                    <h5>Solicitudes Pendientes</h5>
                    <div id="listaCitasPendientes" class="mt-3"></div>
                    <button class="btn btn-link btn-sm text-danger mt-5" onclick="mostrarVista('login')">Cerrar Sesión Admin</button>
                </div>
            </div>
            <div class="col-12 col-lg-8">
                <div class="luxury-card">
                    <h5>Gestión de Fidelización</h5>
                    <div class="table-responsive">
                        <table class="admin-table" id="tablaClientes">
                            <thead>
                                <tr><th>CLIENTA</th><th>SELLOS</th><th class="text-end">ACCIONES</th></tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = "https://lofgjkrcgkqufqpybddn.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvZmdqa3JjZ2txdWZxcHliZGRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4OTc0MjQsImV4cCI6MjA5MzQ3MzQyNH0.8QC7Jq6_lwdGG-iWT0AGiFGl-izWAfIk2tfLC01vJoE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let clientas = [];
        let citas = [];

        // --- VALIDACIONES VITALES ---
        function validarVitalNumeros(input) {
            const original = input.value;
            input.value = input.value.replace(/[^0-9]/g, '');
            if (original !== input.value) {
                alert("🚨 ¡ERROR CRÍTICO DE SISTEMA! Ingresar letras en un campo de contacto es como intentar operar un corazón con un tenedor. Por favor, usa solo números para mantener el pulso del salón.");
            }
        }

        function validarFechaVital(input) {
            const hoy = new Date();
            hoy.setHours(0,0,0,0);
            const elegida = new Date(input.value);
            
            if (elegida < hoy) {
                input.value = "";
                alert("⏳ ¡ALERTA TEMPORAL! El tiempo es nuestro recurso más vital y no podemos viajar al pasado (todavía). Elige una fecha futura para asegurar la existencia de tu cita... y de la humanidad.");
            }
        }

        function configurarFechas() {
            const hoy = new Date().toISOString().split('T')[0];
            const campoFecha = document.getElementById('citaFecha');
            if(campoFecha) campoFecha.setAttribute('min', hoy);
        }

        // --- LÓGICA DE VISTAS ---
        function mostrarVista(idVista) {
            ['login', 'vistaCliente', 'vistaPedirCita', 'vistaAccesoAdmin', 'vistaAdmin'].forEach(v => {
                document.getElementById(v).style.display = 'none';
            });
            const vistaActiva = document.getElementById(idVista);
            vistaActiva.style.display = (idVista === 'vistaAdmin' || idVista === 'login' || idVista === 'vistaPedirCita' || idVista === 'vistaAccesoAdmin') ? 'flex' : 'block';
            if (idVista === 'vistaAdmin') cargarDatosAdmin();
        }

        async function cargarDatosAdmin() {
            const { data: dC } = await sb.from('clientas').select('*');
            clientas = dC || [];
            const { data: dCi } = await sb.from('citas').select('*');
            citas = dCi || [];
            renderAdmin();
        }

        async function loginAdmin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            const { data } = await sb.from('admins').select('*').eq('usuario', user).eq('password', pass).maybeSingle();
            if (data) {
                mostrarVista('vistaAdmin');
            } else {
                alert("🛑 Acceso bloqueado. Las credenciales no coinciden con los registros vitales.");
            }
        }

        async function iniciarSesionCliente() {
            const nombre = document.getElementById('loginUsuario').value.trim().toLowerCase();
            const telef = document.getElementById('loginPass').value.trim();
            const { data } = await sb.from('clientas').select('*').eq('telefono', telef);
            const cliente = (data || []).find(c => c.nombre.toLowerCase() === nombre);
            
            if (cliente) {
                document.getElementById('clienteNombre').innerText = cliente.nombre;
                const grid = document.getElementById('stampsGrid');
                grid.innerHTML = "";
                for(let i=1; i<=10; i++) {
                    grid.innerHTML += `<div class="stamp-circle ${i <= cliente.visitas ? 'active' : ''}">${i}</div>`;
                }
                mostrarVista('vistaCliente');
            } else {
                alert("🔎 Sujeto no identificado. No existen registros de este cliente en nuestra línea de tiempo.");
            }
        }

        async function enviarSolicitudCita() {
            const cita = {
                id: Date.now(),
                nombre_cliente: document.getElementById('citaNombre').value.trim(),
                telefono: document.getElementById('citaTelefono').value.trim(),
                fecha: document.getElementById('citaFecha').value,
                hora: document.getElementById('citaHora').value
            };

            if (!cita.nombre_cliente || !cita.telefono || !cita.fecha || !cita.hora) {
                return alert("⚠️ Incompletitud detectada. Un ser humano necesita todos sus órganos para vivir, y nosotros necesitamos todos tus datos para la cita.");
            }

            const { error } = await sb.from('citas').insert([cita]);
            if (!error) {
                alert("✅ Transmisión exitosa. Tu solicitud ha sido enviada al centro de mando.");
                mostrarVista('login');
            }
        }

        function renderAdmin() {
            const tb = document.querySelector("#tablaClientes tbody");
            tb.innerHTML = "";
            clientas.forEach(c => {
                tb.innerHTML += `<tr>
                    <td><b>${c.nombre}</b><br><small>${c.telefono}</small></td>
                    <td>${c.visitas}/10</td>
                    <td class="text-end">
                        <i class="fa-solid fa-plus action-icon" onclick="sumarVisita(${c.id}, ${c.visitas})"></i>
                        <i class="fa-solid fa-trash-can action-icon" onclick="borrarCliente(${c.id})"></i>
                    </td>
                </tr>`;
            });

            const lista = document.getElementById('listaCitasPendientes');
            lista.innerHTML = "";
            citas.forEach(cita => {
                lista.innerHTML += `<div class="p-3 border mb-2 bg-light small">
                    <b>${cita.nombre_cliente}</b><br>${cita.fecha} - ${cita.hora}<br>
                    <button class="btn btn-sm btn-success mt-2" onclick="aprobarCita(${cita.id})">APROBAR</button>
                </div>`;
            });
        }

        async function sumarVisita(id, actual) {
            if (actual < 10) {
                await sb.from('clientas').update({ visitas: actual + 1 }).eq('id', id);
                cargarDatosAdmin();
            }
        }

        async function borrarCliente(id) {
            if(confirm("¿Deseas eliminar permanentemente esta existencia del sistema?")) {
                await sb.from('clientas').delete().eq('id', id);
                cargarDatosAdmin();
            }
        }

        async function registrarNuevoCliente() {
            const n = document.getElementById('regNombre').value.trim();
            const t = document.getElementById('regTelef').value.trim();
            if(n && t) {
                await sb.from('clientas').insert([{ id: Date.now(), nombre: n, telefono: t, visitas: 0 }]);
                cargarDatosAdmin();
            }
        }
        
        mostrarVista('login');
    </script>
</body>
</html>
