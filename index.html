<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanahan Nails | Luxury Loyalty & Citas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --burgundy: #7A121F;
            --cream: #F9F4F0;
            --dark-text: #2C2C2C;
            --accent: #D4AF37;
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            background-color: var(--cream);
            color: var(--dark-text);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        .brand-container {
            text-align: center;
            position: relative;
            margin-bottom: 30px;
        }

        .brand-main {
            font-family: 'Playfair Display', serif;
            font-size: 44px;
            color: var(--burgundy);
            text-transform: uppercase;
            font-weight: 700;
            line-height: 0.9;
        }

        .brand-sub {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 56px;
            color: var(--burgundy);
            margin-top: -15px;
            display: block;
        }

        nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(122, 18, 31, 0.08);
            background: rgba(249, 244, 240, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-btn {
            text-decoration: none;
            color: var(--burgundy);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 8px 16px;
            border: 1px solid var(--burgundy);
            cursor: pointer;
            font-weight: 600;
            background: transparent;
        }

        .nav-btn:hover {
            background: var(--burgundy);
            color: white;
        }

        .luxury-card {
            background: white;
            padding: 40px;
            box-shadow: 10px 10px 40px rgba(122, 18, 31, 0.03);
            position: relative;
        }

        .form-control {
            border: none;
            border-bottom: 1px solid #D1C7BD;
            border-radius: 0;
            background: transparent;
            padding: 12px 5px;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: var(--burgundy);
            box-shadow: none;
        }

        .btn-luxury {
            background: var(--burgundy);
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            width: 100%;
            margin-top: 20px;
            font-weight: 600;
        }

        .btn-luxury:hover {
            opacity: 0.9;
            color: white;
        }

        .stamps-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin: 35px 0;
        }

        .stamp-circle {
            aspect-ratio: 1;
            border: 1px solid #D1C7BD;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            color: #D1C7BD;
        }

        .stamp-circle.active {
            background: var(--burgundy);
            color: white;
            border-color: var(--burgundy);
        }

        .admin-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
        }

        .admin-table th {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--burgundy);
            border-bottom: 2px solid var(--burgundy);
            padding: 8px 10px;
        }

        .action-icon {
            cursor: pointer;
            margin: 0 6px;
            opacity: 0.6;
        }

        .calendar-box {
            background: var(--cream);
            padding: 15px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            border-left: 3px solid var(--burgundy);
        }
    </style>
</head>
<body>

    <nav>
        <div style="font-family: 'Playfair Display', serif; font-size: 18px; color: var(--burgundy);">S.N</div>
        <div class="d-flex gap-2">
            <button class="nav-btn" onclick="mostrarVista('vistaAccesoAdmin')">Acceso Salón</button>
            <button class="nav-btn" onclick="mostrarVista('login')" style="background: var(--burgundy); color: white;">Inicio</button>
        </div>
    </nav>

    <div class="container py-5">
        
        <div id="login" class="row justify-content-center">
            <div class="col-12 col-md-5">
                <div class="brand-container">
                    <span class="brand-main">SHANAHAN</span>
                    <span class="brand-sub">Nails</span>
                </div>
                <div class="luxury-card">
                    <h5 class="text-center mb-4" style="color: var(--burgundy);">CONSULTAR PUNTOS</h5>
                    <input type="text" class="form-control mb-3" id="loginUsuario" placeholder="Nombre completo">
                    <input type="password" class="form-control mb-4" id="loginPass" placeholder="Teléfono">
                    <button class="btn btn-luxury" onclick="iniciarSesionCliente()">ENTRAR</button>
                    <button class="btn btn-link w-100 mt-3 text-dark text-decoration-none" style="font-size: 11px;" onclick="mostrarVista('vistaPedirCita')">¿NUEVA CLIENTA? PIDE TU CITA AQUÍ</button>
                </div>
            </div>
        </div>

        <div id="vistaCliente" class="row justify-content-center" style="display: none;">
            <div class="col-12 col-md-6 text-center">
                <div class="luxury-card">
                    <h2 id="clienteNombre" style="font-family: 'Playfair Display', serif;">Cliente</h2>
                    <div class="stamps-container" id="stampsGrid"></div>
                    <div id="clienteEstado" class="reward-info mt-3"></div>
                    <button class="btn btn-link mt-4 text-secondary" onclick="mostrarVista('login')">Cerrar Sesión</button>
                </div>
            </div>
        </div>

        <div id="vistaPedirCita" class="row justify-content-center" style="display: none;">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="luxury-card">
                    <h5 class="mb-4 text-center" style="color: var(--burgundy); font-family: 'Playfair Display', serif; font-size: 24px;">SOLICITAR CITA</h5>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Nombre y Apellido</label>
                        <input type="text" class="form-control" id="citaNombre" placeholder="Tu nombre completo">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Teléfono</label>
                        <input type="text" class="form-control" id="citaTelefono" placeholder="Tu teléfono">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small text-muted">Fecha deseada</label>
                            <input type="date" class="form-control" id="citaFecha">
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label small text-muted">Hora deseada</label>
                            <input type="time" class="form-control" id="citaHora">
                        </div>
                    </div>
                    <button class="btn btn-luxury mt-0" onclick="enviarSolicitudCita()">ENVIAR SOLICITUD</button>
                    <button class="btn btn-outline-secondary w-100 mt-2" onclick="mostrarVista('login')">VOLVER</button>

                    <h6 class="mt-5 mb-3" style="color: var(--burgundy); font-family: 'Playfair Display', serif;">Citas disponibles y agendadas</h6>
                    <div id="clienteCalendario" class="calendar-box"></div>
                </div>
            </div>
        </div>

        <div id="vistaAccesoAdmin" class="row justify-content-center" style="display: none;">
            <div class="col-12 col-md-4">
                <div class="luxury-card">
                    <h5 class="text-center mb-4">ACCESO ADMINISTRADOR</h5>
                    <input type="text" class="form-control mb-3" id="adminUser" placeholder="Usuario">
                    <input type="password" class="form-control mb-4" id="adminPass" placeholder="Contraseña">
                    <button class="btn btn-luxury mt-0" onclick="loginAdmin()">ENTRAR AL SALÓN</button>
                    <button class="btn btn-outline-secondary w-100 mt-2" onclick="mostrarVista('login')">VOLVER</button>
                </div>
            </div>
        </div>

        <div id="vistaAdmin" class="row g-4" style="display: none;">
            <div class="col-12 col-lg-4">
                <div class="luxury-card">
                    <h5 class="mb-4">Nueva Clienta</h5>
                    <input type="text" class="form-control mb-3" id="regNombre" placeholder="Nombre">
                    <input type="text" class="form-control mb-4" id="regTelef" placeholder="Teléfono">
                    <button class="btn btn-luxury mt-0" onclick="registrarNuevoCliente()">REGISTRAR</button>
                    
                    <hr class="my-5">
                    
                    <h5>Solicitudes de Citas</h5>
                    <div id="listaCitasPendientes" class="mt-3"></div>

                    <button class="btn btn-link btn-sm text-danger mt-5" onclick="mostrarVista('login')">Cerrar Sesión Admin</button>
                </div>
            </div>
            <div class="col-12 col-lg-8">
                <div class="luxury-card">
                    <h5>Gestión de Fidelización</h5>
                    <div class="table-responsive">
                        <table class="admin-table" id="tablaClientes">
                            <thead>
                                <tr>
                                    <th>CLIENTA</th>
                                    <th>SELLOS</th>
                                    <th class="text-end">ACCIONES</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>

                    <h5 class="mt-5" style="color: var(--burgundy); font-family: 'Playfair Display', serif;">Agenda de Citas Aprobadas</h5>
                    <div id="adminCalendario" class="calendar-box"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalModificar" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content luxury-card">
                <div class="modal-body p-4">
                    <h5 class="text-center mb-4" style="color: var(--burgundy);">Editar Perfil</h5>
                    <input type="hidden" id="editId">
                    <input type="text" class="form-control mb-3" id="editNombre" placeholder="Nombre">
                    <input type="text" class="form-control mb-4" id="editTelefono" placeholder="Teléfono">
                    <button class="btn btn-luxury mt-0" onclick="guardarEdicion()">ACTUALIZAR</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalModificarCita" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content luxury-card">
                <div class="modal-body p-4">
                    <h5 class="text-center mb-4" style="color: var(--burgundy);">Modificar Cita</h5>
                    <input type="hidden" id="editCitaId">
                    <input type="text" class="form-control mb-3" id="editCitaNombre" placeholder="Nombre completo">
                    <input type="text" class="form-control mb-3" id="editCitaTelefono" placeholder="Teléfono">
                    <input type="date" class="form-control mb-3" id="editCitaFecha">
                    <input type="time" class="form-control mb-4" id="editCitaHora">
                    <button class="btn btn-luxury mt-0" onclick="guardarEdicionCita()">ACTUALIZAR CITA</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = "https://lofgjkrcgkqufqpybddn.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvZmdqa3JjZ2txdWZxcHliZGRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4OTc0MjQsImV4cCI6MjA5MzQ3MzQyNH0.8QC7Jq6_lwdGG-iWT0AGiFGl-izWAfIk2tfLC01vJoE";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let clientas = [];
        let citas = [];

        // GESTIÓN DE VISTAS
        function mostrarVista(idVista) {
            ['login', 'vistaCliente', 'vistaPedirCita', 'vistaAccesoAdmin', 'vistaAdmin'].forEach(v => {
                const el = document.getElementById(v);
                if (el) el.style.display = 'none';
            });
            const vistaActiva = document.getElementById(idVista);
            if (vistaActiva) {
                vistaActiva.style.display = (idVista === 'vistaAdmin' || idVista === 'login' || idVista === 'vistaAccesoAdmin' || idVista === 'vistaPedirCita') ? 'flex' : 'block';
                if (idVista === 'vistaAdmin') cargarDatosAdmin();
                if (idVista === 'vistaPedirCita') cargarAgendaCliente();
            }
        }

        // CARGA DE DATOS DESDE SUPABASE
        async function cargarDatosAdmin() {
            const { data: dC } = await sb.from('clientas').select('*');
            clientas = dC || [];
            const { data: dCi } = await sb.from('citas').select('*');
            citas = dCi || [];
            renderAdmin();
            renderCalendarios();
        }

        // LOGIN ADMINISTRADOR
        async function loginAdmin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            const { data, error } = await sb.from('admins').select('*').eq('usuario', user).eq('password', pass).maybeSingle();
            
            if (data) {
                document.getElementById('adminUser').value = '';
                document.getElementById('adminPass').value = '';
                mostrarVista('vistaAdmin');
            } else {
                alert("Credenciales incorrectas");
            }
        }

        // LOGIN CLIENTE
        async function iniciarSesionCliente() {
            const nombre = document.getElementById('loginUsuario').value.trim().toLowerCase();
            const telef = document.getElementById('loginPass').value.trim();
            const { data } = await sb.from('clientas').select('*').eq('telefono', telef);
            
            const cliente = (data || []).find(c => c.nombre.toLowerCase() === nombre);
            
            if (cliente) {
                document.getElementById('clienteNombre').innerText = cliente.nombre;
                const grid = document.getElementById('stampsGrid');
                grid.innerHTML = "";
                for(let i=1; i<=10; i++) {
                    grid.innerHTML += `<div class="stamp-circle ${i <= cliente.visitas ? 'active' : ''}">${i}</div>`;
                }
                
                document.getElementById('clienteEstado').innerText = 
                    cliente.visitas >= 10 ? "✨ ¡SERVICIO GRATIS DISPONIBLE!" : 
                    cliente.visitas === 5 ? "🎁 Tienes un 20% de descuento hoy" : 
                    "Sigue acumulando sellos para tus premios.";
                
                mostrarVista('vistaCliente');
            } else {
                alert("No se encontró el registro. Solicita una cita para registrarte.");
            }
        }

        // SOLICITUD DE CITAS
        async function enviarSolicitudCita() {
            const cita = {
                id: Date.now(),
                nombre_cliente: document.getElementById('citaNombre').value.trim(),
                telefono: document.getElementById('citaTelefono').value.trim(),
                fecha: document.getElementById('citaFecha').value,
                hora: document.getElementById('citaHora').value
            };

            if (!cita.nombre_cliente || !cita.telefono || !cita.fecha || !cita.hora) {
                return alert("Por favor completa todos los campos.");
            }

            const { error } = await sb.from('citas').insert([cita]);
            if (!error) {
                alert("Solicitud enviada con éxito. Queda a la espera de aprobación del salón.");
                document.getElementById('citaNombre').value = "";
                document.getElementById('citaTelefono').value = "";
                document.getElementById('citaFecha').value = "";
                document.getElementById('citaHora').value = "";
                mostrarVista('login');
            } else {
                alert("Error al enviar la solicitud: " + error.message);
            }
        }

        // RENDERIZADO PANEL ADMIN
        function renderAdmin() {
            const tb = document.querySelector("#tablaClientes tbody");
            tb.innerHTML = "";
            clientas.forEach(c => {
                tb.innerHTML += `<tr>
                    <td><b>${c.nombre}</b><br><small>${c.telefono}</small></td>
                    <td>${c.visitas}/10</td>
                    <td class="text-end">
                        <i class="fa-solid fa-plus action-icon" onclick="sumarVisita(${c.id}, ${c.visitas})"></i>
                        <i class="fa-solid fa-pen-to-square action-icon" onclick="abrirEdit(${c.id})"></i>
                        <i class="fa-solid fa-rotate-right action-icon" onclick="resetVistas(${c.id})"></i>
                        <i class="fa-solid fa-trash-can action-icon" onclick="borrarCliente(${c.id})"></i>
                    </td>
                </tr>`;
            });

            const lista = document.getElementById('listaCitasPendientes');
            lista.innerHTML = "";
            if (citas.length === 0) {
                lista.innerHTML = "<p class='text-muted'>No hay solicitudes en este momento.</p>";
            } else {
                citas.forEach(cita => {
                    lista.innerHTML += `<div class="p-3 border mb-2 bg-light small">
                        <b>${cita.nombre_cliente}</b><br>
                        Tel: ${cita.telefono}<br>
                        Fecha: ${cita.fecha} a las ${cita.hora}<br>
                        <button class="btn btn-sm btn-success mt-2" onclick="aprobarCita(${cita.id})">APROBAR Y DAR DE ALTA</button>
                        <button class="btn btn-sm btn-danger mt-2" onclick="rechazarCita(${cita.id})">RECHAZAR</button>
                    </div>`;
                });
            }
        }

        async function cargarAgendaCliente() {
            // Cargar también las citas ya aprobadas/agendadas
            const { data } = await sb.from('citas').select('*');
            citas = data || [];

            const calendarioEl = document.getElementById('clienteCalendario');
            calendarioEl.innerHTML = "";

            if (citas.length === 0) {
                calendarioEl.innerHTML = "<p class='text-muted small'>No hay citas agendadas en este momento.</p>";
            } else {
                citas.forEach(cita => {
                    calendarioEl.innerHTML += `
                        <div class="p-2 border-bottom small">
                            <b>${cita.nombre_cliente}</b><br>
                            Fecha: ${cita.fecha} | Hora: ${cita.hora}<br>
                            <button class="btn btn-link btn-sm text-decoration-none p-0" onclick="abrirModificarCita(${cita.id}, '${cita.nombre_cliente}', '${cita.telefono}', '${cita.fecha}', '${cita.hora}')">
                                <i class="fa-solid fa-pen"></i> Modificar
                            </button>
                        </div>
                    `;
                });
            }
        }

        function renderCalendarios() {
            // Muestra los registros agendados en la vista del administrador
            const adminCal = document.getElementById('adminCalendario');
            adminCal.innerHTML = "";

            if (citas.length === 0) {
                adminCal.innerHTML = "<p class='text-muted small'>No hay citas agendadas.</p>";
            } else {
                citas.forEach(cita => {
                    adminCal.innerHTML += `
                        <div class="p-2 border-bottom small">
                            <b>${cita.nombre_cliente}</b> - Tel: ${cita.telefono}<br>
                            📅 Fecha: ${cita.fecha} | ⏰ Hora: ${cita.hora}
                        </div>
                    `;
                });
            }
        }

        function abrirModificarCita(id, nombre, tel, fecha, hora) {
            document.getElementById('editCitaId').value = id;
            document.getElementById('editCitaNombre').value = nombre;
            document.getElementById('editCitaTelefono').value = tel;
            document.getElementById('editCitaFecha').value = fecha;
            document.getElementById('editCitaHora').value = hora;
            
            var myModal = new bootstrap.Modal(document.getElementById('modalModificarCita'));
            myModal.show();
        }

        async function guardarEdicionCita() {
            const id = document.getElementById('editCitaId').value;
            const nombre = document.getElementById('editCitaNombre').value.trim();
            const tel = document.getElementById('editCitaTelefono').value.trim();
            const fecha = document.getElementById('editCitaFecha').value;
            const hora = document.getElementById('editCitaHora').value;

            if (!nombre || !tel || !fecha || !hora) return alert("Completa todos los campos");

            await sb.from('citas').update({ nombre_cliente: nombre, telefono: tel, fecha: fecha, hora: hora }).eq('id', id);
            alert("Cita modificada con éxito");
            bootstrap.Modal.getInstance(document.getElementById('modalModificarCita')).hide();
            cargarAgendaCliente();
        }

        async function aprobarCita(idCita) {
            const cita = citas.find(c => c.id === idCita);
            if (cita) {
                await sb.from('clientas').insert([{ id: Date.now(), nombre: cita.nombre_cliente, telefono: cita.telefono, visitas: 0 }]);
                await sb.from('citas').delete().eq('id', idCita);
                alert("Clienta aprobada y registrada en el sistema.");
                cargarDatosAdmin();
            }
        }

        async function rechazarCita(idCita) {
            await sb.from('citas').delete().eq('id', idCita);
            alert("Solicitud rechazada.");
            cargarDatosAdmin();
        }

        async function sumarVisita(id, actual) {
            if (actual < 10) {
                await sb.from('clientas').update({ visitas: actual + 1 }).eq('id', id);
                cargarDatosAdmin();
            } else {
                alert("¡El cliente ya ha completado los 10 sellos!");
            }
        }

        async function borrarCliente(id) {
            if(confirm("¿Eliminar cliente definitivamente?")) {
                await sb.from('clientas').delete().eq('id', id);
                cargarDatosAdmin();
            }
        }

        async function registrarNuevoCliente() {
            const n = document.getElementById('regNombre').value.trim();
            const t = document.getElementById('regTelef').value.trim();
            if(n && t) {
                await sb.from('clientas').insert([{ id: Date.now(), nombre: n, telefono: t, visitas: 0 }]);
                document.getElementById('regNombre').value = '';
                document.getElementById('regTelef').value = '';
                cargarDatosAdmin();
            } else {
                alert("Por favor completa nombre y teléfono.");
            }
        }

        function resetVistas(id) { 
            if (confirm("¿Reiniciar puntos?")) { 
                let c = clientas.find(x => x.id === id);
                if (c) {
                    c.visitas = 0;
                    sb.from('clientas').update({ visitas: 0 }).eq('id', id).then(() => {
                        cargarDatosAdmin();
                    });
                }
            } 
        }

        function abrirEdit(id) {
            let c = clientas.find(x => x.id === id);
            document.getElementById('editId').value = c.id;
            document.getElementById('editNombre').value = c.nombre;
            document.getElementById('editTelefono').value = c.telefono;
            new bootstrap.Modal(document.getElementById('modalModificar')).show();
        }

        async function guardarEdicion() {
            let id = document.getElementById('editId').value;
            let n = document.getElementById('editNombre').value.trim();
            let t = document.getElementById('editTelefono').value.trim();
            
            if (!n || !t) return alert("Completa los datos");

            await sb.from('clientas').update({ nombre: n, telefono: t }).eq('id', id);
            cargarDatosAdmin();
            bootstrap.Modal.getInstance(document.getElementById('modalModificar')).hide();
        }

        // INICIALIZACIÓN
        mostrarVista('login');
    </script>
</body>
